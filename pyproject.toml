[project]
name = "snowflake-document-agent"
version = "0.1.0"
description = "Python ELT processes to incrementally load document files into Snowflake Document Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.2",
    "snowflake-connector-python>=3.13.0",
]

[project.scripts]
ingest-local = "snowflake_document_agent.ingest_local:main"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 120

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
