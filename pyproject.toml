[project]
name = "snowdoc"
version = "0.7.0"
description = "CLI to incrementally load documents into Snowflake for use with Snowflake Intelligence agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-evaluation>=0.4.1",
    "charset-normalizer>=3.4.4",
    "lxml>=5.4.0",
    "mammoth>=1.11.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "pip-system-certs>=5.3",
    "pyyaml>=6.0.2",
    "snowflake-connector-python>=3.12.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "agent-evaluation @ git+https://github.com/panasenco/agent-evaluation.git@fix-reasoning-none-validation-error",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
    "snowflake-cli>=3.14.0",
]

[project.scripts]
snowdoc = "snowdoc.cli:main"

[dependency-groups]
dev = [
    "agent-evaluation @ git+https://github.com/panasenco/agent-evaluation.git@fix-reasoning-none-validation-error",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
    "snowflake-cli>=3.14.0",
]

[tool.ruff]
line-length = 120

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
