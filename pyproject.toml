[project]
name = "snowflake-document-agent"
version = "0.1.0"
description = "Python ELT processes to incrementally load document files into Snowflake Document Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.2",
    "snowflake-connector-python>=3.13.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
]

[project.scripts]
ingest-local = "snowflake_document_agent.ingest_local:main"
ingest-opentext = "snowflake_document_agent.ingest_opentext:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.9.0",
    "snowflake-cli>=3.14.0",
    "responses>=0.24.0",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (select with '-m integration')",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
