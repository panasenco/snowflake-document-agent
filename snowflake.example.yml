# Copy to snowflake.yml
definition_version: 2
env:
  admin_role: "ACCOUNTADMIN"
  database: "DOCUMENT_AGENT"
  schema: "DOCUMENTS"
  warehouse: "DOCUMENT_AGENT_WH"
  warehouse_size: "XSMALL"
  warehouse_auto_suspend: 30
  role: "DOCUMENT_AGENT_ROLE"
  search_embedding_model: "snowflake-arctic-embed-l-v2.0"
  chunk_size: 5000
  chunk_overlap: 500
  agent_name: "DOCUMENT_AGENT"
  agent_description: "Agent that can search document contents"
  agent_icon: "DocumentAgentIcon"
  # I couldn't get colors to work any other way except by copying and pasting from `describe agent`...
  # These codes will probably break in the near future but leaving them just in case they actually don't...
  # agent_color: "var(--chartDim_1-x11ij0mo)" # Blue
  # agent_color: "var(--chartDim_8-x1mzf9u0)" # Pink
  # agent_color: "var(--chartDim_3-x11sbcwy)" # Green
  # agent_color: "var(--chartDim_4-x1kcru7n)" # Red
  # agent_color: "var(--chartDim_5-x5ky746)"  # Purple
  agent_color: "var(--chartDim_6-x12aliq8)" # Orange
  agent_specification_without_tools: |
    # Comment to anchor the indentation
      models:
        orchestration: claude-sonnet-4-5

      orchestration:
        budget:
          seconds: 300
          tokens: 16000

      instructions:
        response: |
          Make sure your response is completely grounded in the document chunks you locate.
          When in doubt, admit that you're uncertain or don't know rather than make something up.
          Structure your response in bullet points.
          Every bullet must be connected to a source chunk.
          When multiple sources appear to present conflicting information, present that uncertainty to the user and let
          them make the judgement call.
        orchestration: |
          Use all search tools that you have access to answer the user's questions.
          Aim to synthesize more context from a diverse set of sources whenever possible.
  agent_content_max_results: 20
